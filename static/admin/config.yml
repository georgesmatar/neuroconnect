backend:
  name: github
  repo: georgesmatar/neuroconnect
  branch: main
  base_url: https://api.netlify.com

media_folder: static/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ─────────────────────────────────────────────
  # TEAM MEMBERS
  # ─────────────────────────────────────────────
  - name: "team"
    label: "Team Members"
    label_singular: "Team Member"
    folder: "content/team"
    create: true
    delete: true
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}} — {{fields.role}}"
    sortable_fields: ["weight", "title"]
    fields:
      - { label: "Full Name", name: "title", widget: "string", hint: "e.g. Dr. Georges Matar" }
      - label: "Role"
        name: "role"
        widget: "select"
        options:
          - "Co-Principal Investigator"
          - "Co-Investigator"
          - "Clinical Research Fellow"
          - "Postdoctoral Researcher (AI / iEEG)"
          - "Research Coordinator"
          - "Research Coordinator / MSc Student"
          - "PhD Student"
          - "MSc Student"
          - "Medical Student Researcher"
          - "Research Intern"
        hint: "Must match exactly — the team page groups members by this value."
      - { label: "Affiliation", name: "affiliation", widget: "string", required: false, hint: "e.g. CHU Sainte-Justine / Université de Montréal" }
      - { label: "Display Order (weight)", name: "weight", widget: "number", value_type: "int", min: 1, default: 50, hint: "Lower number = shown first. PIs are 1–3." }
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Upload a square photo. Filename: firstname-lastname.jpg" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Google Scholar URL", name: "scholar", widget: "string", required: false }
      - { label: "PubMed URL", name: "pubmed", widget: "string", required: false }
      - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
      - { label: "Twitter / X URL", name: "twitter", widget: "string", required: false }
      - { label: "Personal Website", name: "website", widget: "string", required: false }
      - { label: "Current Project(s)", name: "project", widget: "string", required: false, hint: "Short project name(s), shown on team cards." }
      - { label: "Biography", name: "body", widget: "markdown", required: false, hint: "2–4 sentences about this person." }

  # ─────────────────────────────────────────────
  # NEWS POSTS
  # ─────────────────────────────────────────────
  - name: "news"
    label: "News Posts"
    label_singular: "News Post"
    folder: "content/news"
    create: true
    delete: true
    identifier_field: "title"
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Headline", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Publication"
          - "Grant"
          - "Award"
          - "Conference"
          - "Lab Update"
          - "Media"
      - { label: "Journal / Source", name: "journal", widget: "string", required: false, hint: "e.g. Nature Communications. Leave blank for non-publication news." }
      - label: "Journal Badge Color"
        name: "journal_color"
        widget: "select"
        required: false
        hint: "Pick a color for the journal badge shown on the news card."
        options:
          - { label: "Nature red", value: "#E8001D" }
          - { label: "Cell Press purple", value: "#6A1B9A" }
          - { label: "JAMA blue", value: "#003087" }
          - { label: "Lancet teal", value: "#006064" }
          - { label: "Epilepsia green", value: "#2E7D32" }
          - { label: "Neurology dark-blue", value: "#1A237E" }
          - { label: "Generic blue", value: "#1565C0" }
          - { label: "Generic grey", value: "#546E7A" }
      - { label: "Summary (card teaser)", name: "summary", widget: "text", hint: "1–2 sentences shown on the news listing card. Keep under 200 characters." }
      - { label: "Full Article Body", name: "body", widget: "markdown", required: false, hint: "Full article text. Supports bold, links, headers." }
