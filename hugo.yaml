params:
  description: "Advancing epilepsy care through surgical innovation and clinical neuroscience"
  tagline: "Where Neuroscience Meets Surgical Precision"
  email: "georgesmatar92@gmail.com"
  github: "https://github.com/georgesmatar"
  lab_name: "NeuroConnect Lab"
  institution: "University Research Lab"
  hero_cta: "Explore Our Research"
  hero_cta_link: "/research/"

  research_areas:
    - title: "Epilepsy"
      icon: "brain"
      description: "Investigating the neural mechanisms of seizure generation, propagation, and termination using cutting-edge electrophysiology and neuroimaging."
    - title: "Epilepsy Surgery"
      icon: "scalpel"
      description: "Developing precision surgical approaches for drug-resistant epilepsy, including SEEG, laser ablation, and neuromodulation therapies."
    - title: "Clinical Neuroscience"
      icon: "network"
      description: "Translating basic science discoveries into improved clinical outcomes through rigorous patient-centered research and trial design."
    - title: "Brain Mapping"
      icon: "map"
      description: "High-resolution mapping of eloquent cortex and seizure networks using intracranial EEG, fMRI, and advanced computational models."

